name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish?"
        required: true
        type: choice
        default: bricks
        options:
          - foundations
          - icons
          - bricks
          - structures
          - compat
      tag:
        description: "Which npm tag to publish to?"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - latest

  workflow_call:
    inputs:
      package:
        required: true
        type: string
        default: bricks
      tag:
        required: true
        type: string
        default: alpha
    secrets:
      NPMJS_PUBLISH_ITWIN:
        required: true

jobs:
  publish:
    name: Build and publish output to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checking out repo
      id-token: write # for npm provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0

      - name: Use Node 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "pnpm"
          registry-url: https://registry.npmjs.org/

      - run: pnpm install

      - run: pnpm --filter="./packages/**" run build

      - run: npm publish --provenance --access public --tag ${{ inputs.tag }}
        working-directory: "./packages/${{ inputs.package }}/"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}
